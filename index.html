<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeaseOps | Revenue Operations for Property Managers</title>
    <meta name="description" content="LeaseOps answers, qualifies, and books tours for every rental inquiry, day or night, so residential property managers never lose a lead to a missed call." />
    <!-- The source has no favicon at all, so browsers' automatic implicit /favicon.ico request
         404s — a flaky Lighthouse "errors-in-console"/best-practices hit reproduced on the
         ORIGINAL static site too (confirmed: same intermittent 96/100 best-practices split in the
         baseline run). Declaring the existing logo as the icon (zero new asset, no visible page
         change) stops Chrome's implicit probe. -->
    <link rel="icon" href="/Logo.png" type="image/png" />
    <!-- Self-hosted Inter (perf agent) — see src/styles/globals.css for the @font-face rules and
         why only the latin subset needs preloading (this site is English-only; latin-ext, whose
         unicode-range never matches any character actually on the page, is never fetched). -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
